<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244a33"/>
      <stop offset="1" stop-color="#0f1d15"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcf5f"/>
      <stop offset="1" stop-color="#4f9a3c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8f2"/>
      <stop offset="1" stop-color="#4fa8d6"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- the sun over the pocket valley -->
    <circle cx="256" cy="232" r="132" fill="url(#sun)"/>
    <!-- far ranges -->
    <path d="M-10 330 L96 196 L168 268 L256 150 L344 268 L416 196 L522 330 Z" fill="#2f5a40"/>
    <path d="M232 182 L256 150 L280 182 L268 176 L256 188 L244 176 Z" fill="#eef3ea"/>
    <!-- the meadow bowl -->
    <path d="M-10 330 Q128 270 256 296 Q384 270 522 330 L522 522 L-10 522 Z" fill="url(#meadow)"/>
    <!-- the river winding through it -->
    <path d="M250 298 C214 330 300 352 262 392 C228 428 300 460 286 522 L214 522 C230 466 166 426 214 388 C248 360 196 330 238 298 Z" fill="url(#river)"/>
    <!-- a single leaf: the ecology half of the name -->
    <path d="M384 466 C356 404 384 352 452 336 C466 404 440 452 384 466 Z" fill="#2f6b34"/>
    <path d="M388 458 C404 420 424 384 448 344" stroke="#cfe9a8" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#e6c36a" stroke-opacity="0.55" stroke-width="8"/>
</svg>
