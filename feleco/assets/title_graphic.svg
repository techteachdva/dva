<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#050a05"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Connecting lines between clusters -->
  <g stroke-width="1.5" opacity="0.35">
    <line x1="640" y1="260" x2="360" y2="360" stroke="#f0f0f0"/>
    <line x1="640" y1="260" x2="920" y2="360" stroke="#f0f0f0"/>
    <line x1="360" y1="360" x2="280" y2="540" stroke="#f0f0f0"/>
    <line x1="920" y1="360" x2="1000" y2="540" stroke="#f0f0f0"/>
    <line x1="280" y1="540" x2="640" y2="620" stroke="#f0f0f0"/>
    <line x1="1000" y1="540" x2="640" y2="620" stroke="#f0f0f0"/>
    <line x1="360" y1="360" x2="920" y2="360" stroke="#f0f0f0"/>
    <line x1="280" y1="540" x2="1000" y2="540" stroke="#f0f0f0"/>
    <line x1="640" y1="260" x2="640" y2="620" stroke="#f0f0f0"/>
  </g>

  <!-- Central cluster: Wolf (Red) -->
  <g transform="translate(640, 260)" filter="url(#glow)">
    <circle r="55" fill="none" stroke="#cc1a1a" stroke-width="3" opacity="0.9"/>
    <circle r="40" fill="none" stroke="#cc1a1a" stroke-width="2.5" opacity="0.7"/>
    <circle r="25" fill="none" stroke="#cc1a1a" stroke-width="2" opacity="0.5"/>
    <circle r="10" fill="#cc1a1a" opacity="0.8"/>
  </g>

  <!-- Left cluster: Sheep (White) -->
  <g transform="translate(360, 360)" filter="url(#glow)">
    <circle r="50" fill="none" stroke="#f0f0f0" stroke-width="3" opacity="0.9"/>
    <circle r="36" fill="none" stroke="#f0f0f0" stroke-width="2.5" opacity="0.7"/>
    <circle r="22" fill="none" stroke="#f0f0f0" stroke-width="2" opacity="0.5"/>
    <circle r="8" fill="#f0f0f0" opacity="0.8"/>
  </g>

  <!-- Right cluster: Human (Tan) -->
  <g transform="translate(920, 360)" filter="url(#glow)">
    <circle r="50" fill="none" stroke="#e6b380" stroke-width="3" opacity="0.9"/>
    <circle r="36" fill="none" stroke="#e6b380" stroke-width="2.5" opacity="0.7"/>
    <circle r="22" fill="none" stroke="#e6b380" stroke-width="2" opacity="0.5"/>
    <circle r="8" fill="#e6b380" opacity="0.8"/>
  </g>

  <!-- Bottom-left cluster: Boar (Brown) -->
  <g transform="translate(280, 540)" filter="url(#glow)">
    <circle r="48" fill="none" stroke="#804d33" stroke-width="3" opacity="0.9"/>
    <circle r="34" fill="none" stroke="#804d33" stroke-width="2.5" opacity="0.7"/>
    <circle r="20" fill="none" stroke="#804d33" stroke-width="2" opacity="0.5"/>
    <circle r="7" fill="#804d33" opacity="0.8"/>
  </g>

  <!-- Bottom-right cluster: Worm (Green) -->
  <g transform="translate(1000, 540)" filter="url(#glow)">
    <circle r="48" fill="none" stroke="#33cc52" stroke-width="3" opacity="0.9"/>
    <circle r="34" fill="none" stroke="#33cc52" stroke-width="2.5" opacity="0.7"/>
    <circle r="20" fill="none" stroke="#33cc52" stroke-width="2" opacity="0.5"/>
    <circle r="7" fill="#33cc52" opacity="0.8"/>
  </g>

  <!-- Bottom-center cluster: Robin (Blue) -->
  <g transform="translate(640, 620)" filter="url(#glow)">
    <circle r="48" fill="none" stroke="#3399dd" stroke-width="3" opacity="0.9"/>
    <circle r="34" fill="none" stroke="#3399dd" stroke-width="2.5" opacity="0.7"/>
    <circle r="20" fill="none" stroke="#3399dd" stroke-width="2" opacity="0.5"/>
    <circle r="7" fill="#3399dd" opacity="0.8"/>
  </g>

  <!-- Falcon accent (Gold) - smaller satellite -->
  <g transform="translate(520, 180)" filter="url(#glow)">
    <circle r="30" fill="none" stroke="#f5f5dc" stroke-width="2.5" opacity="0.8"/>
    <circle r="20" fill="none" stroke="#f5f5dc" stroke-width="2" opacity="0.6"/>
    <circle r="10" fill="none" stroke="#f5f5dc" stroke-width="1.5" opacity="0.4"/>
    <circle r="4" fill="#f5f5dc" opacity="0.7"/>
  </g>

  <!-- Mushroom accent (Purple) - smaller satellite -->
  <g transform="translate(760, 180)" filter="url(#glow)">
    <circle r="30" fill="none" stroke="#9966cc" stroke-width="2.5" opacity="0.8"/>
    <circle r="20" fill="none" stroke="#9966cc" stroke-width="2" opacity="0.6"/>
    <circle r="10" fill="none" stroke="#9966cc" stroke-width="1.5" opacity="0.4"/>
    <circle r="4" fill="#9966cc" opacity="0.7"/>
  </g>

  <!-- Small connecting nodes along lines -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="500" cy="310" r="3"/>
    <circle cx="780" cy="310" r="3"/>
    <circle cx="320" cy="450" r="3"/>
    <circle cx="960" cy="450" r="3"/>
    <circle cx="460" cy="580" r="3"/>
    <circle cx="820" cy="580" r="3"/>
    <circle cx="640" cy="440" r="4" opacity="0.6"/>
  </g>
</svg>
