<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Somnia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icons/somnia-192.png">
  <title>Somnia — Enter the Dreamscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Kalnia+Glaze&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="menu-window menu-splash-active">
  <div id="menu-splash" class="menu-splash" aria-hidden="false">
    <div class="menu-splash-inner">
      <img
        class="menu-splash-art"
        src="images/somnia-box-art.jpg"
        alt="Somnia"
        width="1200"
        height="1200"
        decoding="async"
      >
    </div>
  </div>
  <div id="app">
    <header class="top-bar">
      <button type="button" class="brand brand-logo-btn" id="btn-somnia-changelog" title="Somnia Changelog &amp; Credits" aria-label="Open Somnia Changelog and Credits">
        <span class="version-label">Somnia v 21.2</span>
        <h1>Somnia</h1>
        <p class="tagline">Cooperative Dreamscape Roguelike</p>
      </button>
      <div class="header-actions">
        <button type="button" class="btn btn-icon" data-music-toggle aria-pressed="true" title="Mute music">🔊</button>
      </div>
    </header>

    <main>
      <section id="screen-setup" class="screen active" aria-label="Main menu">
        <div class="setup-triad">
          <div class="setup-panel-left menu-glass-panel">
            <h2 class="menu-panel-title">Dream Settings</h2>
            <label class="field">
              <span>Players</span>
              <select id="setup-players">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
              </select>
            </label>
            <label class="field">
              <span>Difficulty</span>
              <select id="setup-length">
                <option value="daydream">Daydream — 12 pts · 14 Dreams</option>
                <option value="nap">Nap — 18 pts · 17 Dreams</option>
                <option value="deep">Deep Sleep — 24 pts · 21 Dreams</option>
              </select>
            </label>
            <label class="field field-view-mode">
              <span>Interface size</span>
              <select id="setup-view-mode">
                <option value="auto">Auto — fits your screen</option>
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
              </select>
            </label>
          </div>

          <div class="setup-panel-center menu-glass-panel">
            <h2 class="menu-panel-title">Choose Dreamers</h2>
            <div id="dreamer-picker" class="card-grid picker menu-dreamer-picker"></div>
            <div id="setup-phase-legend" class="setup-round-flow menu-phase-legend" aria-label="Round phases"></div>
          </div>

          <div class="setup-panel-right menu-glass-panel">
            <div id="setup-continue-wrap" class="setup-continue-wrap hidden">
              <button type="button" id="btn-continue" class="btn btn-continue-dream">Continue Dream</button>
              <p id="setup-continue-meta" class="setup-continue-meta"></p>
            </div>
            <div class="setup-launch-row">
              <button type="button" id="btn-start" class="btn begin-dream-btn" disabled>Begin Dreaming</button>
              <button type="button" id="btn-tutorial-mode" class="btn btn-tutorial-menu" title="Two guided rounds with step-by-step coaching">Tutorial</button>
            </div>
            <p class="menu-tutorial-hint">Tutorial Mode walks you through two guided rounds. The in-game <strong>Tips</strong> button shows a short reminder anytime.</p>
            <button type="button" id="btn-pwa-install" class="btn btn-pwa-install hidden" hidden>Install Somnia</button>
            <p id="pwa-install-hint" class="pwa-install-hint" hidden>On iPad or phone: Share → Add to Home Screen for a full-bleed table.</p>
          </div>
        </div>
      </section>
    </main>

  </div>

  <div id="utility-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop utility-backdrop"></div>
    <div class="modal-content utility-content">
      <button class="modal-close utility-close" aria-label="Close">&times;</button>
      <div id="utility-modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/setup.js"></script>
</body>
</html>
