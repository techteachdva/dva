<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Feleco</title>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="Feleco.icon.png" />
	<link rel="apple-touch-icon" href="Feleco.apple-touch-icon.png" />
	<style>
		html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
		#canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
		#gd-loading { position: fixed; inset: 0; background: #1a2418; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; font-family: system-ui, sans-serif; }
		#gd-loading.hidden { display: none !important; }
		#gd-loading .text { color: #d7e6c8; font-size: 18px; margin-top: 16px; text-align: center; max-width: 28rem; padding: 0 1rem; }
		#gd-loading .bar-wrap { width: 240px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 16px; overflow: hidden; }
		#gd-loading .bar { height: 100%; width: 0%; background: #8fbf6a; }
		#gd-play-btn { margin-top: 20px; padding: 12px 32px; font-size: 18px; background: #8fbf6a; color: #14200f; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
	</style>
</head>
<body>
	<div id="gd-loading">
		<div class="text" id="gd-loading-text">Loading Feleco...</div>
		<div class="bar-wrap"><div class="bar" id="gd-progress-bar"></div></div>
		<button type="button" id="gd-play-btn" disabled>Play</button>
	</div>
	<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
	<script>
(function () {
	try {
		Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return 1; } });
	} catch (e) {}

	var path = location.pathname;
	var basePath = path ? (location.origin + path.substring(0, path.lastIndexOf('/') + 1)) : '';
	var loading = document.getElementById('gd-loading');
	var progressBar = document.getElementById('gd-progress-bar');
	var loadingText = document.getElementById('gd-loading-text');
	var playBtn = document.getElementById('gd-play-btn');
	var engine = null;

	function isSafariLike() {
		var ua = navigator.userAgent;
		var isIOS = /iPad|iPhone|iPod/.test(ua) ||
			(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		var isMacSafari = /Macintosh/.test(ua) &&
			/Version\/[\d.]+/.test(ua) &&
			/Safari\//.test(ua) &&
			!/Chrom(e|ium)|Edg\//.test(ua);
		return isIOS || isMacSafari;
	}

	var useThreads = !isSafariLike();
	var loaderSrc = useThreads ? 'Feleco.js' : 'safe/Feleco.js';
	var executableName = useThreads ? 'Feleco' : 'safe/Feleco';

	function showBlocked(msg) {
		playBtn.disabled = true;
		playBtn.style.display = 'none';
		loadingText.textContent = msg;
	}

	function bootEngine() {
		var missing = Engine.getMissingFeatures({ threads: useThreads });
		if (missing.length > 0) {
			showBlocked('Feleco cannot run here: ' + missing.join('; ') + '.');
			return;
		}
		engine = new Engine({
			args: [],
			canvasResizePolicy: 1,
			emscriptenPoolSize: useThreads ? 8 : 4,
			ensureCrossOriginIsolationHeaders: true,
			executable: basePath + executableName,
			experimentalVK: false,
			fileSizes: {},
			focusCanvas: true,
			gdextensionLibs: [],
			godotPoolSize: 4,
			mainPack: basePath + 'Feleco.pck'
		});
		playBtn.disabled = false;
		loadingText.textContent = 'Click to play';
	}

	function startGame() {
		playBtn.style.display = 'none';
		loadingText.textContent = 'Loading Feleco...';
		engine.startGame({
			onProgress: function (cur, tot) {
				if (tot > 0 && progressBar) {
					progressBar.style.width = (100 * cur / tot) + '%';
				}
			}
		}).then(function () {
			loading.classList.add('hidden');
		}).catch(function (err) {
			loadingText.textContent = err && err.message ? err.message : 'Failed to load. Refresh to try again.';
			playBtn.style.display = 'block';
			playBtn.disabled = false;
			console.error(err);
		});
	}

	playBtn.addEventListener('click', startGame);
	var loader = document.createElement('script');
	loader.src = loaderSrc;
	loader.onload = bootEngine;
	loader.onerror = function () {
		showBlocked('Feleco could not load its engine. Refresh and try again.');
	};
	document.body.appendChild(loader);
})();
	</script>
</body>
</html>
